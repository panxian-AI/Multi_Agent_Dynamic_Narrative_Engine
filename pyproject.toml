[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madne"
version = "0.1.0"
description = "Multi-Agent Dynamic Narrative Engine - 多 Agent 动态叙事引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 本地 GPU 生图后端（IMG_BACKEND=diffusers）
image = [
    "torch>=2.0",
    "diffusers>=0.25",
    "transformers>=4.35",
    "accelerate>=0.24",
    "Pillow>=10.0",
]
# CLIP-I / DINO 人物一致性验收（IMG_METRICS=1）
metrics = [
    "torch>=2.0",
    "open_clip_torch>=2.24",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
madne = "madne.cli:app"

[tool.setuptools.packages.find]
include = ["madne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
